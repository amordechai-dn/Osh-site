name: Publish Osh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: osh-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare public assets
        run: |
          mkdir _site
          cp index.html styles.css app.js model.js vault.js sync.js icon.svg manifest.webmanifest sw.js version.json _site/
          cp -R fonts _site/fonts
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Wait for published artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "GitHub did not expose the uploaded artifact within one minute"
          exit 1
      - uses: actions/deploy-pages@v5
        id: deploy
